server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome → cache longo. index.html nunca em cache (para o
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback de SPA: qualquer rota não-arquivo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
