# Custom error pages
error_page 403 /403.html;
error_page 404 /404.html;

location /403.html {
    root /var/www/error_pages/;
}

location /404.html {
    root /var/www/error_pages/;
}

# favicon.ico
location = /favicon.ico {
    access_log /dev/stdout nexus;
}

# robots.txt
location = /robots.txt {
    access_log /dev/stdout nexus;
}

