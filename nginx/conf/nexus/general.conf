# gzip
gzip off;
gzip_http_version 1.1;
gzip_vary on;
gzip_comp_level 6;
gzip_proxied any;
gzip_min_length 1024;
gzip_buffers 16 16k;

gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    application/xhtml+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/ttf
    font/otf
    font/opentype
    image/svg+xml;

gzip_disable "msie6";

# brotli
brotli off;
brotli_comp_level 5;
brotli_static on;

brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/xhtml+xml
    image/svg+xml
    font/ttf
    font/otf
    font/opentype;

# zstd
zstd off;
zstd_comp_level 7;
zstd_min_length 1024;

zstd_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/xhtml+xml
    image/svg+xml
    font/ttf
    font/otf
    font/opentype;