user www-data;
# worker_processes / worker_rlimit_nofile são gerados por api.tune no entrypoint
# (e via API em POST /nginx/tune), conforme os recursos efetivos da máquina.
include generated/tuning.conf;
pid /run/nginx.pid;
timer_resolution 100ms;
# Send master/stream errors to the container's stderr...
error_log /dev/stderr warn;
# ...e também a um arquivo em volume compartilhado, lido pela API (página Logs /
# error_log). nginx aceita múltiplos error_log; o diretório vem de um volume
# montado tanto no container do nginx quanto no da API (NGINX_ERROR_LOG).
error_log /var/log/nexus/nginx.log warn;
events {
    # determines how much clients will be served per worker
    # max clients = worker_connections * worker_processes
    # max clients is also limited by the number of socket connections available on the system (~64k)
    # worker_connections é gerado por api.tune no entrypoint (e via /nginx/tune).
    include generated/events-tuning.conf;
    # optmized to serve many clients with each thread, essential for linux -- for testing environment
    use epoll;
    # accept as many connections as possible, may flood worker connections if set too low -- for testing environment
    multi_accept on;
}
http {
    # Upstreams (http E stream compartilham o mesmo diretório — arquivos sem
    # wrapper, "context" é só um comentário-marcador lido pela API; incluído
    # aqui e também dentro do stream{} abaixo, harmless se não referenciado).
    include upstream-enabled/*.conf;
    charset utf-8;
    # copies data between one FD and other from within the kernel
    # faster then read() + write()
    sendfile on;
    # send headers in one peace, its better then sending them one by one
    tcp_nopush on;
    # don't buffer data sent, good for small data bursts in real time
    tcp_nodelay on;
    log_not_found off;
    # if the request body size is more than the buffer size, then the entire (or partial)
    # request body is written into a temporary file
    client_body_buffer_size 256k;
    # headerbuffer size for the request header from client -- for testing environment
    client_header_buffer_size 4k;
    # maximum number and size of buffers for large headers to read from client request
    large_client_header_buffers 4 8k;
    client_max_body_size 100m;
    server_names_hash_bucket_size 512;
    types_hash_bucket_size 64;
    types_hash_max_size 2048;
    variables_hash_bucket_size 128;
    variables_hash_max_size 2048;
    # GeoIP2 Support/Variables
    include nexus/geoip2.conf;
    # Holtz Nexus Global Settings and Variables
    include nexus/ec.conf;
    # only log critical errors
    error_log /dev/stderr crit;
    # MIME
    include mime.types;
    default_type application/octet-stream;
    # Time and Date with milliseconds: injeta a fração de segundo do $msec
    # (resolução do nginx é milissegundo — 3 casas; não há microssegundo nativo)
    # no $time_local. Ex.: 01/Jul/2026:10:00:00.123 +0000.
    map $time_local:$msec $time_local_w_ms {
        ~^(\S+)(\s+\S+):\d+\.(\d+)$ $1.$3$2;
    }
    map $request_uri:$http_user_agent $loggable {
        default 1;
        ~^/healthcheck: 0;
        ~:nexus-monitor 0;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }
    log_format nexus escape=json "{" "\"ts\":$msec," "\"time\":\"$time_local_w_ms\"," "\"id\":\"$request_id\"," "\"host\":\"$host\"," "\"m\":\"$request_method\"," "\"pr\":\"$server_protocol\"," "\"uri\":\"$request_uri\"," "\"q\":\"$args\"," "\"st\":$status," "\"ip\":\"$remote_addr\"," "\"rt\":$request_time," "\"bs\":$bytes_sent," "\"rl\":$request_length," "\"bl\":$body_bytes_sent," "\"ua\":\"$http_user_agent\"," "\"ref\":\"$http_referer\"," "\"up\":\"$upstream_addr\"," "\"uct\":$upstream_connect_time," "\"uht\":$upstream_header_time," "\"urt\":$upstream_response_time," "\"ucs\":\"$upstream_cache_status\"," "\"ubs\":$upstream_bytes_sent," "\"ubr\":$upstream_bytes_received," "\"cl\":$sent_http_content_length," "\"ct\":\"$sent_http_content_type\"," "\"enc\":\"$sent_http_content_encoding\"," "\"gz\":\"$gzip_ratio\"," "\"ssl\":\"$ssl_protocol\"," "\"ray\":\"$http_cf_ray\"," "\"origin\":\"$ec_origin\"," "\"country\":\"$geoip2_data_country_name\"," "\"state\":\"$geoip2_data_state_name\"," "\"city\":\"$geoip2_data_city_name\"," "\"isp\":\"$geoip2_data_asn_organization\"}";
    # Send all request logs to the container's stdout (skips healthchecks via $loggable)
    access_log /var/log/nginx/access.log nexus if=$loggable;
    # cache informations about FDs, frequently accessed files
    # can boost performance, but you need to test those values
    open_file_cache max=50000 inactive=30s;
    open_file_cache_valid 10s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    # Zona compartilhada de proxy_cache usada pelo painel (toggle de cache por
    # server em Servidores > Cache; zona padrão quando o server não define uma
    # dedicada). Cada server pode ter sua PRÓPRIA zona: nesse caso a API grava um
    # proxy_cache_path ao lado do server{} no arquivo http-available/<slug>.conf
    # (contexto http, pois o include vive dentro do http{}). Layout em
    # /var/cache/nginx (criado e liberado p/ www-data no Dockerfile): compartilhada
    # em shared/, zonas dedicadas de server em zones/<zona>, de rota em routes/<zona>.
    proxy_cache_path /var/cache/nginx/shared levels=1:2 keys_zone=nexus_cache:10m max_size=1g inactive=60m use_temp_path=off;
    # SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # ssl_early_data off: a menos que trate o header Early-Data no Laravel
    ssl_early_data off;
    # ssl_conf_command Options KTLS; # use to enable kTLS
    sendfile_max_chunk 512k;
    # OCSP stapling exige que a CA emissora rode um responder OCSP público (ex.:
    # Let's Encrypt). Certificados self-signed ou assinados pela CA própria (ver
    # painel > Certificados) não têm isso — habilitar aqui globalmente só gera
    # "ssl_stapling ignored, no OCSP responder URL" pra todo server que não usa
    # Let's Encrypt. Para um server específico com cert Let's Encrypt, ligue
    # ssl_stapling/ssl_stapling_verify direto no server block dele.
    resolver 1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001] valid=180s;
    resolver_timeout 3s;
    # DH parameters
    ssl_dhparam /etc/ssl/dhparam.pem;
    # allow the server to close connection on non responding client, this will free up memory
    reset_timedout_connection on;
    # request timed out -- default 60
    client_body_timeout 30;
    # if client stop responding, free up memory -- default 60
    send_timeout 10;
    # server will close connection after this time -- default 75
    keepalive_timeout 60;
    # number of requests client can make over keep-alive -- for testing environment
    keepalive_requests 1000;
    keepalive_time 1h;
    # Security reasons, turn off nginx versions
    server_tokens off;
    # Disable global etags (Automatic added to images and css files)
    etag off;
    # Security reasons, disable server header
    more_set_headers "Server: $ec_name";
    geo $ip_whitelist {
        default 0;
        127.0.0.1 1;
    }
    map $ip_whitelist $limited_ip {
        0 $binary_remote_addr;
        1 "";
    }
    # # limit the number of connections per single IP
    # limit_conn_zone $binary_remote_addr zone=connsPerIP:20m;
    # limit_conn_log_level warn;
    # limit_req_zone $binary_remote_addr zone=wplogin:10m rate=10r/s;
    # # limit the number of requests for a given session
    # limit_req_zone $limited_ip zone=reqsPerMinutePerIP:30m rate=6000r/s;
    # limit_req zone=reqsPerMinutePerIP burst=8000 nodelay;
    # limit_req_status 429;
    # how long to wait for the client to send a request header
    client_header_timeout 1m;
    # #
    # Virtual Host Configs
    # #
    include /etc/nginx/http-enabled/*.conf;
    # #
    # Configurações internas não são gerenciadas pela API.
    # #
    include /etc/nginx/internal/*.conf;
}
stream {
    include upstream-enabled/*.conf;
    # Time and Date with milliseconds (ver nota no bloco http acima).
    map $time_local:$msec $time_local_w_ms {
        ~^(\S+)(\s+\S+):\d+\.(\d+)$ $1.$3$2;
    }
    log_format mysql escape=json "{\"version\":\"nginx/$nginx_version\"," "\"time\":\"$msec\"," "\"protocol\":\"$protocol\"," "\"ip\":\"$remote_addr\"," "\"port\":\"$server_port\"," "\"status\":\"$status\"," "\"bytes-out\":\"$bytes_sent\"," "\"bytes-in\":\"$bytes_received\"," "\"upstream-addr\":\"$upstream_addr\"," "\"upstream-connect-time\":\"$upstream_connect_time\"," "\"upstream-first-byte-time\":\"$upstream_first_byte_time\"," "\"upstream-session-time\":\"$upstream_session_time\"," "\"upstream-bytes-out\":\"$upstream_bytes_sent\"," "\"upstream-bytes-in\":\"$upstream_bytes_received\"," "\"session_time\":\"$session_time\"}";
    # match mysql_handshake {
    # send \x00;
    # expect ~* \x00\x00; # NullNull "filler" in handshake response packet
    # }

    include /etc/nginx/stream-enabled/*.conf;
}
# Aplicações de live streaming (módulo nginx-rtmp), agrupadas por porta —
# 1 arquivo = 1 porta = todas as aplicações dela (ver api/routers/rtmp.py).
rtmp {
    include /etc/nginx/rtmp-enabled/*.conf;
}
